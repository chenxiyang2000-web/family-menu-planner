<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>家常菜单 · 家庭点菜与菜单规划</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=20260730-2">
  <link rel="stylesheet" href="upgrade.css?v=20260730-2">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="#library" data-view="library"><span>家常</span>菜单</a>
    <nav aria-label="主导航">
      <button data-view="library" class="nav-btn active">ALL</button>
      <button data-view="start" class="nav-btn">START</button>
      <button data-view="shopping" class="nav-btn">LIST</button>
    </nav>
    <button class="icon-btn" id="export-data" title="导出所有数据">⇩</button>
  </header>
  <main id="app" class="container"><div class="app-loading" role="status">正在读取菜单数据…</div></main>
  <dialog id="dish-dialog" class="modal"></dialog>
  <dialog id="slot-dialog" class="modal"></dialog>
  <input id="import-file" type="file" accept="application/json,.json" hidden>
  <script>
    window.setTimeout(function () {
      var loading = document.querySelector('#app .app-loading');
      if (!loading) return;
      loading.classList.add('error');
      loading.innerHTML = '<b>页面模块加载失败</b><span>请检查网络后重新加载；本地和云端菜单数据不会被删除。</span><button type="button" onclick="location.reload()">重新加载</button>';
    }, 12000);
  </script>
  <script type="module" src="js/app.js?v=20260730-2"></script>
</body>
</html>
